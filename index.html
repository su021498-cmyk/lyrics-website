<!DOCTYPE html>
<html>

        body {
            font-family: Arial;
            background: #0b1d2a;

            text-align: center;
            padding: 30px;
        }
        h1 {
            color: #ffd700;
        }
        .song {
            margin: 30px 0;
        }
        .lyrics {
            white-space: pre-line;
            line-height: 1.8;
        }
    </style>
</head>

<body>

        <h2>Way Maker</h2>
        <p><b>Artist:</b> Sinach</p>
        <div class="lyrics">

I worship You...
        </div>
    </div>

    <div class="song">
        <h2>What A Beautiful Name</h2>
        <p><b>Artist:</b> Hillsong Worship</p>
        <div class="lyrics">
You were the Word at the beginning...
        </div>
    </div>

</body>
</html>
